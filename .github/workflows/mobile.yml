name: Mobile

on:
  push:
    paths: [ "mobile/**", ".github/workflows/mobile.yml" ]
  pull_request:
    paths: [ "mobile/**", ".github/workflows/mobile.yml" ]

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
