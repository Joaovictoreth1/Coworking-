xname: coworking

networks:
  app-network:
    driver: bridge

services:
  db:
    image: mysql:8.0
    container_name: coworking-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-coworking}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: coworking-phpmyadmin
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 128M
    ports:
      - "8081:80"
    networks:
      - app-network
    profiles:
      - tools # Opcional: permite rodar apenas quando necessário

  backend:
    build: 
      context: ./backend
    container_name: coworking-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    ports:
      - "8000:8000"
    environment:
      PHP_CLI_SERVER_WORKERS: 4
    networks:
      - app-network
    command: >
      sh -c "
      echo '=== Preparando ambiente Laravel ===' &&
      [ ! -f .env ] && cp .env.example .env;
      [ ! -f vendor/autoload.php ] && composer install --no-interaction --prefer-dist;
      mkdir -p bootstrap/cache storage/app/public storage/framework/cache storage/framework/sessions storage/framework/views storage/logs &&
      chmod -R ug+rwX storage bootstrap/cache &&
      php artisan package:discover --ansi &&
      grep -q '^APP_KEY=.\+' .env || php artisan key:generate --force &&
      echo '=== Executando migrations e seeders ===' &&
      php artisan migrate --force &&
      php artisan db:seed --force &&
      php artisan storage:link --force &&
      echo '=== Iniciando servidor Laravel ===' &&
      exec php artisan serve --host=0.0.0.0 --port=8000
      "

  frontend:
    image: node:22-alpine
    container_name: coworking-frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    networks:
      - app-network
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"

volumes:
  db_data:
  frontend_node_modules:
