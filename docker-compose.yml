name: coworking

networks:
  app-network:
    driver: bridge

services:
  db:
    image: mysql:8.0
    container_name: coworking-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?defina DB_ROOT_PASSWORD no .env}
      MYSQL_DATABASE: ${DB_DATABASE:-coworking}
      MYSQL_USER: ${DB_USERNAME:-coworking}
      MYSQL_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: coworking-phpmyadmin
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 128M
    ports:
      - "127.0.0.1:8081:80"
    networks:
      - app-network
    profiles:
      - tools # Opcional: permite rodar apenas quando necessário

  backend:
    build:
      context: ./backend
    container_name: coworking-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      PHP_CLI_SERVER_WORKERS: 4
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-coworking}
      DB_USERNAME: ${DB_USERNAME:-coworking}
      DB_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
    networks:
      - app-network
    command:
      - sh
      - -ec
      - |
        [ -f .env ] || cp .env.example .env
        [ -f vendor/autoload.php ] || composer install --no-interaction --prefer-dist
        mkdir -p bootstrap/cache storage/app/public storage/framework/cache storage/framework/sessions storage/framework/views storage/logs
        chmod -R ug+rwX storage bootstrap/cache
        php artisan package:discover --ansi
        grep -q '^APP_KEY=.' .env || php artisan key:generate --force
        php artisan migrate --force
        php artisan storage:link --force
        exec php artisan serve --host=0.0.0.0 --port=8000

  frontend:
    image: node:22-alpine
    container_name: coworking-frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    networks:
      - app-network
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"

volumes:
  db_data:
  frontend_node_modules:
