name: coworking

services:
  db:
    image: mysql:8.0
    container_name: coworking-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: coworking
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: coworking-phpmyadmin
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 128M
    ports:
      - "8081:80"

  backend:
    build: ./backend
    container_name: coworking-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    ports:
      - "8000:8000"
    environment:
      PHP_CLI_SERVER_WORKERS: 4
    command:
      - sh
      - -c
      - |
        set -e

        echo "=== Preparando ambiente Laravel ==="

        if [ ! -f .env ]; then
          cp .env.example .env
        fi

        if [ ! -f vendor/autoload.php ]; then
          composer install --no-interaction --prefer-dist
        fi

        mkdir -p bootstrap/cache
        mkdir -p storage/app/public
        mkdir -p storage/framework/cache
        mkdir -p storage/framework/sessions
        mkdir -p storage/framework/views
        mkdir -p storage/logs

        chmod -R ug+rwX storage bootstrap/cache

        echo "=== Descobrindo pacotes Laravel ==="
        php artisan package:discover --ansi

        if ! grep -q '^APP_KEY=.\+' .env; then
          php artisan key:generate --force
        fi

        echo "=== Aguardando MySQL ==="
        until php -r 'try { new PDO("mysql:host=db;port=3306;dbname=coworking", "root", "root"); } catch (Throwable $$e) { exit(1); }'; do
          sleep 2
        done

        echo "=== Executando migrations ==="
        php artisan migrate --force

        echo "=== Executando seeders ==="
        php artisan db:seed --force

        echo "=== Configurando storage ==="
        php artisan storage:link --force

        echo "=== Iniciando servidor Laravel ==="
        exec php artisan serve --host=0.0.0.0 --port=8000

  frontend:
    image: node:22-alpine
    container_name: coworking-frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"

volumes:
  db_data:
  frontend_node_modules: